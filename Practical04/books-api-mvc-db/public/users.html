<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 20px;
      }
      form div,
      .controls {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="text"] {
        width: 260px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        margin-right: 8px;
        margin-bottom: 8px;
        padding: 10px 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #0056b3;
      }
      .user-item {
        border: 1px solid #ccc;
        padding: 12px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      .user-item h3 {
        margin-top: 0;
      }
      .user-item button {
        margin-right: 5px;
      }
      #message {
        margin-top: 15px;
        font-weight: bold;
      }
      .user-books {
        margin-top: 10px;
        padding-left: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Users</h1>
    <p>
      <a href="index.html">Back to Books List</a> |
      <a href="user-create.html">Create New User</a>
    </p>

    <div class="controls">
      <form id="searchUserForm">
        <label for="searchTerm">Search users by username or email</label>
        <input type="text" id="searchTerm" name="searchTerm" placeholder="Search term" />
        <button type="submit">Search</button>
        <button type="button" id="clearSearchBtn">Clear</button>
      </form>
      <button id="fetchUsersBtn">Refresh Users</button>
      <button id="fetchUsersWithBooksBtn">Show Users with Books</button>
    </div>

    <div id="message"></div>
    <div id="usersList">Loading users...</div>

    <script src="users-script.js"></script>
  </body>
</html>
